[package]
name = "yosh-plugin-manager"
version = "0.2.9"
edition = "2024"
description = "Plugin manager for yosh shell"
license = "MIT"
repository = "https://github.com/k-ymmt/yosh"

[lib]
name = "yosh_plugin_manager"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
serde_json = "1"
# `platform-verifier` delegates TLS chain validation to the OS trust
# store (Keychain on macOS, SChannel on Windows, openssl-probe on
# Linux), which performs AIA fetching when a server omits intermediate
# certificates. GitHub release assets redirect to Azure Blob Storage,
# whose endpoint sends only the leaf cert; rustls + webpki-roots cannot
# complete the chain on its own and fails with `UnknownIssuer`. See
# https://github.com/k-ymmt/yosh/issues/2.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
wasmtime = { version = "27", default-features = false, features = ["component-model", "cranelift", "runtime"] }
wasmtime-wasi = { version = "27", default-features = false }
yosh-plugin-api = { version = "0.2.0", path = "../yosh-plugin-api" }
nix = { version = "0.31", features = ["signal", "process"] }
regex = "1"

[dev-dependencies]
mockito = "1"
